.focus-question{background:var(--deep);padding:23px 24px;color:white;border-radius:14px;position:relative;overflow:hidden;margin-bottom:16px}.focus-question:after{content:'?';position:absolute;right:16px;top:-15px;font:120px Georgia,serif;color:#ffffff11}.focus-question .eyebrow{color:#aad3f6}.focus-question h2{font:750 22px/1.28 Georgia,serif;max-width:750px;margin:8px 0 7px}.focus-question p{font-size:12px;color:#d5e4ef;margin:0;max-width:720px}
.study-roadmap{display:flex;gap:7px;flex-wrap:wrap;margin:11px 0 24px}.study-roadmap a{font-size:11px;text-decoration:none;border:1px solid var(--line);background:var(--panel);padding:8px 11px;border-radius:9px;font-weight:700}.study-roadmap a:hover{background:var(--pale)}
.reform-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:19px}.reform-step{position:relative;padding:24px;border:1px solid var(--line);border-radius:15px;background:var(--panel);min-height:155px;overflow:hidden}.reform-step .year{font:800 30px/1 Georgia,serif;color:var(--blue);display:block;margin-bottom:16px}.reform-step h3{margin:0 0 7px;font-size:15px}.reform-step p{font-size:12px;color:var(--muted);line-height:1.6;margin:0}.reform-step:after{content:'→';position:absolute;right:12px;top:12px;font-size:20px;color:var(--faint)}.reform-step:last-child:after{content:'✓'}

'use strict';
const SEED=[{"id": "transacao-2026", "title": "Receita amplia até 30 de dezembro o prazo para aderir a dois editais de transação tributária", "date": "2026-11-03", "published": "2026-11-03", "checked": "2026-11-04", "org": "Receita Federal", "trib": "Tributos federais", "category": "Contencioso", "kind": "Ato administrativo", "impact": "Alta", "status": "Prazo prorrogado", "stage": "Publicado", "summary": "A Receita Federal anunciou a prorrogação, até 30 de dezembro de 2026, da adesão às modalidades de transação previstas nos Editais RFB nº 9 e nº 10/2026.", "source": "https://www.gov.br/receitafederal/pt-br/assuntos/noticias/2026/novembro/receita-federal-prorroga-prazo-para-adesao-a-editais-de-transacao-tributaria-ate-30-de-dezembro", "sourceName": "Receita Federal · notícia oficial", "topics": ["Transação tributária", "Regularidade fiscal"], "sections": {"aconteceu": "Em 3 de novembro de 2026, a Receita Federal informou que o prazo para adesão aos Editais de Transação RFB nº 9 e nº 10/2026 foi prorrogado até 30 de dezembro de 2026.", "contexto": "Os editais oferecem modalidades de negociação de créditos tributários em discussão administrativa, conforme condições próprias de elegibilidade, desconto e pagamento. A data de adesão limita a janela de acesso a essas modalidades.", "discussao": "A questão prática é quais débitos podem ser incluídos, em que condições a adesão se torna vantajosa e quais compromissos processuais e financeiros decorrerão da transação.", "decisao": "Foi anunciada a ampliação do prazo de adesão para 30/12/2026. A notícia não modifica, por si, todos os requisitos materiais definidos nos editais.", "mudanca": "O marco temporal para solicitar a adesão foi estendido. Permanecem essenciais a leitura dos editais e a identificação dos débitos elegíveis.", "impactos": "Contribuintes podem reavaliar passivos administrativos, comparar o custo da transação com a continuidade do litígio e conferir os requisitos formais para adesão.", "aberto": "A aplicação concreta de descontos, entrada, garantias e efeitos sobre processos depende das regras dos editais e da situação do débito. Não há conclusão individual automática.", "acompanhar": "Consultar o texto da portaria mencionada na notícia, os Editais RFB 9 e 10/2026 e os canais oficiais de adesão antes de orientar qualquer contribuinte."}, "timeline": [["2026-11-03", "Prorrogação anunciada", "Confirmado"], ["2026-12-30", "Nova data-limite informada", "Prazo futuro"]], "question": "Até quando é possível aderir aos Editais 9 e 10/2026?", "before": "A adesão às modalidades dos Editais 9 e 10/2026 estava limitada ao prazo anteriormente estabelecido.", "now": "A Receita Federal anunciou a prorrogação do prazo de adesão até 30/12/2026.", "watch": "Conferir os requisitos dos editais e a elegibilidade de cada débito.", "why": "A prorrogação abre mais tempo para avaliar a negociação de créditos em discussão administrativa."}, {"id": "nfse-diretrizes", "title": "Empresas do Simples devem emitir NFS-e pelo sistema nacional desde 1º de novembro: entenda as regras", "date": "2026-11-01", "published": "2026-10-29", "checked": "2026-11-04", "org": "NFS-e Nacional", "trib": "ISS / IBS / CBS", "category": "Obrigações acessórias", "kind": "Orientação administrativa", "impact": "Alta", "status": "Efeitos iniciados", "stage": "Em vigor", "summary": "Orientação oficial publicada em 29/10 esclarece a emissão nacional para ME e EPP optantes do Simples a partir de 1º/11 e destaca a data de competência como critério operacional.", "source": "https://www.gov.br/nfse/pt-br/noticias/nfs-e-informa-diretrizes-sobre-a-obrigatoriedade-da-emissao-da-nfs-e-nacional-para-optantes-do-simples-nacional/", "sourceName": "Portal NFS-e · orientação oficial", "topics": ["NFS-e Nacional", "Reforma Tributária"], "sections": {"aconteceu": "A partir de 1º de novembro de 2026, ME e EPP optantes do Simples Nacional passaram a estar sujeitas à emissão de NFS-e pelo Emissor Nacional, conforme orientação oficial publicada em 29 de outubro.", "contexto": "A padronização da emissão de documentos de serviços envolve adaptação municipal e empresarial. A Resolução CGSN nº 191/2026 já havia estabelecido o marco de novembro.", "discussao": "A dúvida operacional concentra-se na utilização do emissor nacional, no tratamento das notas retroativas e na relação entre competência do serviço e disponibilidade de sistemas locais.", "decisao": "O Portal NFS-e esclareceu que a data de competência orienta as validações e as travas de emissão. Para competências a partir de 01/11, optantes devem emitir no ambiente nacional, inclusive em municípios com emissores próprios.", "mudanca": "A rotina de emissão de serviços por optantes abrangidos passa ao padrão nacional. O marco para as disposições de CBS/IBS aplicáveis ao Simples exige análise autônoma.", "impactos": "É necessário revisar integrações por API, parametrização, fluxos de emissão, notas retroativas e orientações aos emissores de serviços.", "aberto": "Situações excepcionais, regras de contingência e exigências técnicas precisam ser conferidas na documentação do Portal NFS-e. A orientação não substitui testes operacionais.", "acompanhar": "Revisar documentação de integração e eventuais avisos posteriores no Portal NFS-e, com atenção às regras de efeitos de IBS/CBS a partir de 2027."}, "timeline": [["2026-08-14", "Resolução CGSN nº 191/2026 explicada pela Receita", "Contexto"], ["2026-10-29", "Diretrizes operacionais divulgadas", "Confirmado"], ["2026-11-01", "Início da obrigatoriedade indicada", "Em vigor"], ["2027-01-01", "Etapa adicional de IBS/CBS para optantes", "Efeito futuro"]], "question": "Quem deve usar o Emissor Nacional e desde quando?", "before": "A emissão envolvia sistemas municipais e uma transição para o padrão nacional.", "now": "A orientação do Portal NFS-e aponta a exigência de emissão nacional para ME e EPP optantes a partir de 01/11/2026.", "watch": "Revisar integrações, notas retroativas e validações pela data de competên async function loadDailyFeed(){
 if(location.protocol==='file:'){feedInfo.state='local';render();return}
 try{
   const url=new URL('news/updates.json',location.href);url.searchParams.set('t',String(Date.now()));
   const res=await fetch(url,{cache:'no-store'});
   if(!res.ok) throw Error('HTTP '+res.status);
   const data=await res.json();
   if(!data || !Array.isArray(data.entries)) throw Error('Formato da base inválido');
   LIVE=data.entries.filter(e=>e && /^auto-[a-f0-9]{16}$/.test(e.id||'') && iso(e.date) && iso(e.published) && validURL(e.source) && typeof e.title==='string' && e.automated===true).slice(0,250);
   feedInfo={state:data.checkedAt?'ok':'sem-execucao',checkedAt:data.checkedAt||null,sources:Array.isArray(data.sources)?data.sources:[],notice:data.notice||'',count:LIVE.length};
   render();
 }catch(error){feedInfo.state='erro';feedInfo.notice=String(error);render()}
}

function renderLegislacao(){const a=entries().filter(x=>['Legislação','Reforma Tributária','Obrigações acessórias'].includes(x.category));return pageTitle('Legislação e administração','O que mudou nas regras tributárias — e quando começa a valer?','Acompanhe publicação, vigência e produção de efeitos de atos. Compare versões quando o texto integral estiver documentado.')+`<div class="panel panelpad" style="margin-bottom:16px"><div class="section-header"><div><h2>O que mudou entre duas datas?</h2><p>Compare acontecimentos cadastrados na base local.</p></div></div><div class="toolbar" style="margin-bottom:15px"><label class="small muted">De <input type="date" class="field" data-compare="compareA" value="${esc(state.compareA)}"></label><label class="small muted">Até <input type="date" class="field" data-compare="compareB" value="${esc(state.compareB)}"></label></div>${entries().filter(e=>e.date>=state.compareA&&e.date<=state.compareB).map(e=>`<div class="statline"><span>${fmt(e.date)} · ${esc(e.category)}</span><button class="btn btn-ghost btn-sm" data-article="${esc(e.id)}">${esc(e.title)} →</button></div>`).join('')||'<p class="muted small">Nenhum acontecimento cadastrado nesse intervalo.</p>'}</div><div class="note warning" style="margin-bottom:15px"><strong>Comparação normativa:</strong> esta versão evita apresentar trechos legais reconstruídos como citações oficiais. A comparação abaixo sintetiza cenários, com link para a fonte. Para redação anterior × posterior, acrescente as versões integrais verificadas em uma atualização manual.</div><div class="compare" style="margin-bottom:19px"><div class="panel"><div class="kicker">Antes · NFS-e no Simples</div><h3>Marco anterior à mudança</h3><p class="muted small">Havia previsão anterior de início em setembro de 2026, posteriormente revogada pela Resolução CGSN 191/2026.</p></div><div class="panel"><div class="kicker">Depois · Resolução CGSN 191/2026</div><h3>Obrigatoriedade desde 01/11/2026</h3><p class="muted small">A emissão nacional é exigida no marco de novembro; exigências relativas a IBS e CBS para optantes devem observar calendário próprio a partir de 2027.</p><a href="${esc(validURL(findEntry('nfse-resolucao')?.source))}" target="_blank" rel="noopener noreferrer" class="more-link">Fonte explicativa ↗</a></div></div><div class="panel"><div class="panelpad section-header"><h2>Normas e orientações cadastradas</h2><button class="btn btn-outline btn-sm" data-action="add">＋ Cadastrar ato</button></div>${a.map(card).join('')}</div>`}
function renderBiblioteca(){const E=entries().filter(e=>store.favorites.includes(e.id));const read=entries().filter(e=>store.read.includes(e.id));return pageTitle('Biblioteca pessoal','Seus estudos, no mesmo lugar','Favoritos, leituras recentes e anotações armazenados localmente. Exporte a base para preservar seu trabalho.',`<button class="btn btn-outline" data-action="export">↓ Exportar biblioteca</button>`)+`<div class="grid2"><div class="panel"><div class="panelpad section-header"><h2>★ Salvos (${E.length})</h2></div>${E.length?E.map(card).join(''):empty('Salve um assunto pelo ícone de estrela no radar.')}</div><div class="panel"><div class="panelpad section-header"><h2>◷ Histórico de leitura (${read.length})</h2></div>${read.length?read.map(e=>`<div class="news-card"><div><h3 class="news-title"><button data-article="${esc(e.id)}">${esc(e.title)}</button></h3><p class="muted small">${esc(e.category)} · ${fmt(e.date)}</p></div></div>`).join(''):empty('As análises abertas aparecerão aqui.')}</div></div><div class="panel panelpad" style="margin-top:16px"><h2 style="font-size:16px">Anotações</h2>${Object.keys(store.notes).filter(k=>store.notes[k]?.trim()).length?Object.entries(store.notes).filter(([k,v])=>v?.trim()).map(([k,v])=>`<div style="border-top:1px solid var(--line);padding:13px 0"><b>${esc(findEntry(k)?.title||k)}</b><p class="muted small">${esc(v)}</p><button class="btn btn-ghost btn-sm" data-article="${esc(k)}">Abrir anotação →</button></div>`).join(''):empty('Escreva e salve notas dentro de um dossiê.')}</div>`}
function renderAgenda(){let all=timelineAll(),future=all.filter(t=>t.date>=TODAY);return pageTitle('Calendário e evolução','Quais são os próximos marcos tributários?','Marcos confirmados, datas futuras e hipóteses em discussão exibidos separadamente.')+`<div class="grid2"><div class="panel panelpad"><h2 style="margin:0 0 22px;font-size:16px">Próximos eventos cadastrados</h2>${future.length?`<div class="timeline">${future.map(t=>`<div class="timeitem"><span>${fmt(t.date)} · ${esc(t.status)}</span><b>${esc(t.label)}</b><button class="btn btn-ghost btn-sm" data-article="${esc(t.id)}">${esc(t.entry)} →</button></div>`).join('')}</div>`:empty('Não há marcos futuros conhecidos na base local.')}</div><div class="panel panelpad"><h2 style="margin:0 0 22px;font-size:16px">Histórico de acontecimentos</h2><div class="timeline">${all.filter(t=>t.date<TODAY).reverse().slice(0,22).map(t=>`<div class="timeitem"><span>${fmt(t.date)} · ${esc(t.status)}</span><b>${esc(t.label)}</b><button class="btn btn-ghost btn-sm" data-article="${esc(t.id)}">${esc(t.entry)} →</button></div>`).join('')}</div></div></div>`}
const THEMES=[['NFS-e Nacional','Padrão nacional, integrações, notas técnicas e calendário IBS/CBS.'],['Aduaneiro','RECOF, RECOF-SPED, drawback, rastreabilidade e ICMS.'],['Regularidade fiscal','CPEN, responsabilidade tributária, inscrições e garantias.'],['Lei do Bem','Incentivos a P&D, comprovação e controvérsias de elegibilidade.'],['Contencioso administrativo','CARF, PGE, SEFAZ, prazos, recursos e processos.'],['Tributação e gênero','Justiça fiscal, impactos distributivos e políticas orçamentárias.']];
function renderTemas(){return pageTitle('Painéis complementares','Acompanhe os assuntos que mais aparecem na prática','Acompanhe frentes específicas e personalize os temas disponíveis.')+`<div class="grid3">${[...THEMES,...store.customTopics.map(t=>[t,'Tema adicionado à sua biblioteca local.'])].map(([t,desc])=>{let n=entries().filter(e=>[e.title,e.summary,...(e.topics||[])].join(' ').toLowerCase().includes(t.toLowerCase())).length;return `<div class="panel feature"><div class="ficon">▣</div><h3>${esc(t)}</h3><p>${esc(desc)}</p><div class="toolbar"><span class="tag soft">${n} registro(s)</span><button class="btn btn-ghost btn-sm" data-action="topic-search" data-topic="${esc(t)}">Explorar →</button></div></div>`}).join('')}</div><div class="panel panelpad" style="margin-top:16px"><h2 style="font-size:15px;margin-top:0">Criar tema personalizado</h2><div class="toolbar"><input class="field" id="newTopic" style="width:min(320px,100%)" placeholder="Nome do tema"><button class="btn btn-primary" data-action="add-topic">＋ Adicionar painel</button></div></div>`}
function renderFontes(){return pageTitle('Metodologia e gestão da base','Fontes, atualização e integridade','Transparência sobre a origem do conteúdo, o recorte temporal e as funcionalidades disponíveis.',`<div class="toolbar"><button class="btn btn-primary" data-action="add">＋ Inserir notícia</button><button class="btn btn-outline" data-action="import">↑ Importar JSON</button></div>`)+feedBanner()+`<div class="note warning" style="margin-bottom:19px"><strong>Metodologia:</strong> os dossiês iniciais têm referência de 04/11/2026. A coleta diária importa publicações dos feeds oficiais, com título, data, resumo e link, sem confirmar automaticamente os efeitos jurídicos. O agendamento do GitHub depende de execução e acesso às fontes. Consulte sempre os documentos integrais.</div><div class="grid2"><div class="panel panelpad"><h2 style="font-size:16px">Portais oficiais para consulta</h2>${SOURCES.map(x=>`<div class="statline"><span>${esc(x[0])}</span><a href="${esc(validURL(x[1]))}" target="_blank" rel="noopener noreferrer">Abrir ↗</a></div>`).join('')}</div><div><div class="panel panelpad"><h2 style="font-size:16px">Ferramentas disponíveis</h2><div class="statline"><span>Pesquisar e filtrar fichas</span><b>Disponível</b></div><div class="statline"><span>Salvar favoritos, notas e temas</span><b>Disponível</b></div><div class="statline"><span>Importar e exportar base JSON</span><b>Disponível</b></div><div class="statline"><span>Exportar radar em CSV</span><b>Disponível</b></div><div class="statline"><span>Alertas externos automáticos</span><b>Não configurados</b></div><div class="statline"><span>Coleta automática diária (após publicação)</span><b>Programada via GitHub Actions</b></div><div class="toolbar" style="margin-top:18px"><button class="btn btn-outline btn-sm" data-action="export">↓ Exportar JSON</button><button class="btn btn-outline btn-sm" data-action="import">↑ Importar JSON</button><button class="btn btn-outline btn-sm" data-action="export-csv">↓ Exportar CSV</button></div></div><div class="panel panelpad" style="margin-top:16px"><h2 style="font-size:16px">Assuntos acompanhados localmente</h2><p class="small muted">Selecionar um assunto apenas o destaca neste navegador. Não envia notificações.</p>${['Reforma Tributária','Jurisprudência','Contencioso','Obrigações acessórias','Legislação'].map(t=>`<label style="display:flex;gap:9px;margin:10px 0;cursor:pointer"><input type="checkbox" data-watch="${esc(t)}" ${store.watched.includes(t)?'checked':''}> ${esc(t)}</label>`).join('')}</div></div></div>`}
function render(){let view=document.getElementById('view');let names={inicio:'Visão geral',radar:'Radar de novidades',entenda:'Entenda os temas',jurisprudencia:'Jurisprudência',reforma:'Reforma Tributária',legislacao:'Legislação e normas',biblioteca:'Biblioteca',agenda:'Linha do tempo',temas:'Painéis temáticos',fontes:'Fontes e atualizações'};
let body=state.articleId?articleView(findEntry(state.articleId)):({inicio:renderInicio,radar:renderRadar,entenda:renderEntenda,jurisprudencia:renderJuris,reforma:renderReforma,legislacao:renderLegislacao,biblioteca:renderBiblioteca,agenda:renderAgenda,temas:renderTemas,fontes:renderFontes}[state.page]||renderInicio)();
view.innerHTML=body+`<footer class="footer"><span>Cantinho Tributário · Inteligência jurídica de uso pessoal</span><span>Dossiês-base: 04/11/2026 · Coleta do radar: ${feedInfo.checkedAt?fmt(feedInfo.checkedAt.slice(0,10)):'pendente'}</span></footer>`;
document.getElementById('breadcrumb').textContent=state.articleId?'Análise jurídica':names[state.page]||'Visão geral';
document.querySelectorAll('.navitem').forEach(el=>el.classList.toggle('active',!state.articleId&&el.dataset.nav===state.page));document.body.classList.toggle('dark',store.theme==='dark');
}
function go(p){state.page=p;state.articleId=null;document.getElementById('sidebar').classList.remove('open');render();window.scrollTo(0,0)}
function openArticle(id){if(!findEntry(id)){toast('Registro não encontrado.');return}state.articleId=id;store.read=[id,...store.read.filter(x=>x!==id)].slice(0,40);persist();document.getElementById('sidebar').classList.remove('open');render();window.scrollTo(0,0)}
function download(name,content,mime){let blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJSON(){download('cantinho-tributario-backup.json',JSON.stringify({app:'Cantinho Tributário',exportedAt:new Date().toISOString(),entries:entries(),custom:store.custom,favorites:store.favorites,read:store.read,notes:store.notes,watched:store.watched,customTopics:store.customTopics},null,2),'application/json');toast('Backup JSON exportado.')}
function exportCSV(){let heads=['titulo','data_fato','data_publicacao','orgao','tributo','categoria','relevancia','situacao','resumo','fonte','conferido'];let vals=entries().map(e=>[e.title,e.date,e.published,e.org,e.trib,e.category,e.impact,e.status,e.summary,e.source,e.checked]);let quote=x=>'"'+String(x??'').replace(/"/g,'""')+'"';download('cantinho-tributario-radar.csv','\ufeff'+[heads,...vals].map(r=>r.map(quote).join(';')).join('\r\n'),'text/csv;charset=utf-8');toast('CSV exportado.')}
function importJSON(){let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{let f=input.files?.[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!x||!Array.isArray(x.custom))throw Error('Formato inválido');const cleaned=x.custom.filter(e=>e&&typeof e.id==='string'&&typeof e.title==='string'&&iso(e.date)&&validURL(e.source)).slice(0,500).map(e=>({...e,sections:e.sections&&typeof e.sections==='object'?e.sections:{},timeline:Array.isArray(e.timeline)?e.timeline:[],topics:Array.isArray(e.topics)?e.topics:[],checked:e.checked||TODAY}));store.custom=[...new Map([...store.custom,...cleaned].map(e=>[e.id,e])).values()];for(const k of ['favorites','read','watched','customTopics'])if(Array.isArray(x[k]))store[k]=x[k].filter(v=>typeof v==='string').slice(0,1000);if(x.notes&&typeof x.notes==='object')store.notes=Object.fromEntries(Object.entries(x.notes).filter(([k,v])=>typeof v==='string').slice(0,1000));persist();go('fontes');toast(`${cleaned.length} registro(s) importado(s).`)}catch(err){toast('Não foi possível importar. Use um backup JSON gerado por este site.')}};input.click()}
function addEntry(f){const g=n=>String(f.get(n)||'').trim();if(!validURL(g('source'))){toast('Forneça um endereço https:// válido.');return}let date=iso(g('date')),pub=iso(g('published'));if(!date||!pub){toast('Informe datas válidas.');return}let uid='local-'+Date.now();let sections=Object.fromEntries(KEYS.map(k=>[k,g(k)]));let e={id:uid,title:g('title'),date,published:pub,checked:TODAY,org:g('org'),trib:g('trib'),category:g('category'),kind:'Cadastro manual',impact:g('impact'),status:g('status')||'Cadastrado manualmente',stage:'Registro manual',summary:g('summary'),source:g('source'),sourceName:'Fonte informada pelo usuário',topics:[],sections,timeline:[[date,'Acontecimento cadastrado','Informação manual']],addedAt:new Date().toISOString()};store.custom.unshift(e);persist();document.getElementById('modalOverlay').classList.remove('show');document.getElementById('addForm').reset();openArticle(uid);toast('Atualização cadastrada na base local.')}
document.addEventListener('submit',e=>{if(e.target.id==='addForm'){e.preventDefault();addEntry(new FormData(e.target))}});
document.addEventListener('change',e=>{let el=e.target;if(el.dataset.filter){state[el.dataset.filter]=el.value;render()}else if(el.dataset.compare){state[el.dataset.compare]=el.value;render()}else if(el.dataset.sort){state.sort=el.value;render()}else if(el.dataset.watch){store.watched=el.checked?[...new Set([...store.watched,el.dataset.watch])]:store.watched.filter(x=>x!==el.dataset.watch);persist()}});
document.getElementById('globalSearch').addEventListener('input',e=>{state.globalSearch=e.target.value.trim();if(state.globalSearch){state.articleId=null;state.page='radar';render()}else if(state.page==='radar')render()});
document.addEventListener('click',e=>{let el=e.target.closest('[data-nav],[data-article],[data-action],[data-period],[data-topic]');if(!el)return;if(el.dataset.article){openArticle(el.dataset.article);return}if(el.dataset.nav){go(el.dataset.nav);return}if(el.dataset.period){state.period=el.dataset.period;render();return}if(el.dataset.topic&&!el.dataset.action){state.topic=state.topic===el.dataset.topic?'Todos':el.dataset.topic;render();return}
const act=el.dataset.action;const id=el.dataset.id;
switch(act){case 'menu':document.getElementById('sidebar').classList.toggle('open');break;case 'refresh-feed':loadDailyFeed();toast('Consultando arquivo de notícias…');break;case 'theme':store.theme=store.theme==='dark'?'light':'dark';persist();render();break;case 'favorite':store.favorites=star(id)?store.favorites.filter(x=>x!==id):[...store.favorites,id];persist();render();toast(star(id)?'Salvo nos favoritos.':'Removido dos favoritos.');break;case 'print':window.print();break;case 'save-note':{let value=document.getElementById('studyNote')?.value||'';store.notes[id]=value;persist();toast('Anotação salva neste navegador.');break}case 'add':document.getElementById('modalOverlay').classList.add('show');break;case 'close-modal':document.getElementById('modalOverlay').classList.remove('show');break;case 'markvisit':store.lastVisit=new Date().toISOString();persist();render();toast('Visita registrada.');break;case 'export':exportJSON();break;case 'export-csv':exportCSV();break;case 'import':importJSON();break;case 'add-topic':{let input=document.getElementById('newTopic');let v=input?.value.trim();if(v&&v.length<=80&&!store.customTopics.includes(v)){store.customTopics.push(v);persist();render();toast('Tema adicionado.')}else toast('Informe um tema novo de até 80 caracteres.');break}case 'topic-search':state.globalSearch=el.dataset.topic;document.getElementById('globalSearch').value=state.globalSearch;state.period='all';go('radar');break;}}
);
document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target.id==='modalOverlay')e.target.classList.remove('show')});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('modalOverlay').classList.remove('show')});
render();
loadDailyFeed();
setInterval(loadDailyFeed,60*60*1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadDailyFeed()});
</script>
</body></html>
