name: Atualizar radar tributário diariamente

on:
  schedule:
    - cron: '27 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cantinho-radar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Buscar projeto
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar fontes oficiais
        run: python scripts/update_feed.py
      - name: Salvar novidades para o site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/news/updates.json
          if git diff --cached --quiet; then
            echo "Nenhuma mudança para registrar."
            exit 0
          fi
          git commit -m "Atualiza radar tributário [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
