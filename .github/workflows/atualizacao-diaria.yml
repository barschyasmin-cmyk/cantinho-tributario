name: Publicar Cantinho Tributário e atualizar radar
on:
  push:
    branches: [main]
  schedule:
    - cron: '27 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: cantinho-pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Buscar projeto
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Atualizar radar com fontes oficiais
        run: python scripts/update_feed.py
      - name: Preservar histórico coletado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/news/updates.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza radar tributário"
            git push
          fi
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
